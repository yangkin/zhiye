name: zhiye-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zhiye
          POSTGRES_PASSWORD: zhiye
          POSTGRES_DB: zhiye_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U zhiye"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install workspace dependencies
        run: npm ci

      - name: Run eval baseline check
        run: node evals/run-eval.mjs --check

      - name: Run runner tests
        run: cd runner && npm test

      - name: Typecheck and build web
        run: |
          cd web && npx tsc --noEmit -p .
          cd .. && npm run build -w web

      - name: Run server tests
        env:
          KIMI_API_KEY: test-key
        run: cd server && mvn test -Dtest='!SkillHubTest,!SkillHubEnabledTest' -Dsurefire.failIfNoSpecifiedTests=false
