apiVersion: apps/v1
kind: Deployment
metadata:
  name: zhiye-api
  namespace: zhiye
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: Never
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { cpu: "2", memory: 1536Mi }
