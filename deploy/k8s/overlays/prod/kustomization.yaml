# 生产（阿里云 ACK）占位 overlay —— 部署前把所有 <...> 换成真实值。
#
# 前提（见 deploy/k8s/README.md 第 2、8 节）：
#   1. 公司 OpenSandbox Server + API key；沙箱命名空间里指向织页 NAS 的 RWX PVC（ZHIYE_SANDBOX_PVC）。
#   2. NAS：通用型 NAS 文件系统 + 挂载点（与集群同 VPC），新建目录 /zhiye-runtime；
#      用 NAS CSI（nasplugin.csi.alibabacloud.com）静态 PV（api 侧；沙箱侧由公司平台挂载同一个 PVC）。
#   3. RDS PostgreSQL 16，库 zhiye；OSS bucket（内网 endpoint）；ACR 镜像仓库 + 拉取凭据 Secret。
#   4. api 能访问 OpenSandbox Server 和平台 Ingress Gateway；NetworkPolicy 放行沙箱命名空间访问模型网关；
#      ingress-nginx。
#   5. 节点池：常规池打标签 zhiye/pool=general，运行 api / site。沙箱节点池（zhiye/pool=sandbox + 污点）
#      只在保留 legacy k8s provider 回滚时需要；OpenSandbox 沙箱由公司平台调度，crun 是普通运行时。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: zhiye-server
    newName: <registry>.cn-shenzhen.cr.aliyuncs.com/zhiye/zhiye-server
    newTag: "<版本>"
patches:
  - path: pv-nas.yaml
    target: { kind: PersistentVolume }
  # CSI 要求每个 PV 的 volumeHandle 唯一（两个 PV 仍指向同一个 NAS 目录）
  - patch: '[{"op":"replace","path":"/spec/csi/volumeHandle","value":"zhiye-runtime-zhiye"}]'
    target: { kind: PersistentVolume, name: zhiye-runtime-zhiye }
  - patch: '[{"op":"replace","path":"/spec/csi/volumeHandle","value":"zhiye-runtime-sandbox"}]'
    target: { kind: PersistentVolume, name: zhiye-runtime-sandbox }
  - path: config.yaml
  - path: npm-mirror.yaml
