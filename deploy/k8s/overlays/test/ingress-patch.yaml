apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zhiye
  namespace: zhiye
spec:
  ingressClassName: traefik
  # 仅一级子域 zhiye.csot.tcl.com 命中公司 *.csot.tcl.com 通配符证书；
  # 二级子域 preview.zhiye.csot.tcl.com 与 *.zhiye.csot.tcl.com 走 HTTP 80（避免通配符证书层级不匹配告警）
  tls:
    - hosts:
        - zhiye.csot.tcl.com
      secretName: zhiye-test-tls
  rules:
    - host: zhiye.csot.tcl.com
      http:
        paths:
          - path: /t/
            pathType: Prefix
            backend: { service: { name: zhiye-site, port: { number: 8083 } } }
          - path: /p/
            pathType: Prefix
            backend: { service: { name: zhiye-site, port: { number: 8083 } } }
          - path: /llm
            pathType: Prefix
            backend: { service: { name: zhiye-site, port: { number: 8083 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: zhiye-api, port: { number: 8080 } } }
    - host: preview.zhiye.csot.tcl.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: zhiye-site, port: { number: 8083 } } }
    - host: "*.zhiye.csot.tcl.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: zhiye-site, port: { number: 8083 } } }
