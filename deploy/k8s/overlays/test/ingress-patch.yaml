apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zhiye
  namespace: zhiye
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - zhiye.csot.tcl.com
        - preview.zhiye.csot.tcl.com
        - "*.zhiye.csot.tcl.com"
      secretName: zhiye-test-tls
  rules:
    - host: zhiye.csot.tcl.com
      http:
        paths:
          - path: /llm
            pathType: Prefix
            backend: { service: { name: zhiye-site, port: { number: 8083 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: zhiye-api, port: { number: 8080 } } }
    - host: preview.zhiye.csot.tcl.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: zhiye-site, port: { number: 8083 } } }
    - host: "*.zhiye.csot.tcl.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: zhiye-site, port: { number: 8083 } } }
