# NFS → 阿里云 NAS CSI 静态卷（两个 PV 指向同一个 NAS 目录）
- op: remove
  path: /spec/nfs
- op: replace
  path: /spec/storageClassName
  value: zhiye-nas-static
- op: replace
  path: /spec/mountOptions
  value: ["nolock", "tcp", "noresvport", "vers=3"]
- op: add
  path: /spec/csi
  value:
    driver: nasplugin.csi.alibabacloud.com
    volumeHandle: zhiye-runtime   # 在 kustomization.yaml 里按 PV 名改成唯一值
    volumeAttributes:
      server: "<挂载点>.cn-shenzhen.nas.aliyuncs.com"
      path: "/zhiye-runtime"
