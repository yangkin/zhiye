# 公司 RKE2 测试集群：Traefik + zhiye 单命名空间沙箱，复用现有 RWX PVC，单副本。
# 部署前确认 TLS Secret、数据库、对象存储和外部集成 Secret。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - traefik.yaml
  - upload-ingress.yaml
  - hpa.yaml
images:
  - name: zhiye-server
    newName: 10.110.27.113/zhiye/zhiye-server
    newTag: "v0.3.17-test"
patches:
  # 现有 zhiye/zhiye-runtime 由集群手工创建，api 与沙箱直接复用。
  - patch: |-
      apiVersion: v1
      kind: PersistentVolume
      metadata: { name: zhiye-runtime-zhiye }
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: PersistentVolume
      metadata: { name: zhiye-runtime-sandbox }
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: { name: zhiye-runtime, namespace: zhiye }
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata: { name: zhiye-runtime, namespace: zhiye-sandbox }
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Namespace
      metadata: { name: zhiye-sandbox }
      $patch: delete
  - path: config.yaml
  - path: ingress-patch.yaml
  # 通用集群没有 zhiye/pool 节点标签，移除 base 里的 nodeSelector（后续拆专用节点池时删掉这两条）
  - patch: '[{"op":"remove","path":"/spec/template/spec/nodeSelector"}]'
    target: { kind: Deployment, name: zhiye-api, namespace: zhiye }
  - patch: '[{"op":"remove","path":"/spec/template/spec/nodeSelector"}]'
    target: { kind: Deployment, name: zhiye-site, namespace: zhiye }
  - patch: '[{"op":"replace","path":"/metadata/annotations","value":{"traefik.ingress.kubernetes.io/service.serverstransport":"zhiye-zhiye-transport@kubernetescrd"}}]'
    target: { kind: Ingress, name: zhiye }
  - patch: '[{"op":"replace","path":"/spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name","value":"kube-system"}]'
    target: { kind: NetworkPolicy, name: api-ingress }
  - patch: '[{"op":"replace","path":"/spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name","value":"kube-system"}]'
    target: { kind: NetworkPolicy, name: site-ingress }
  - patch: '[{"op":"replace","path":"/spec/ingress/2/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name","value":"zhiye"}]'
    target: { kind: NetworkPolicy, name: api-ingress }
  - patch: '[{"op":"replace","path":"/metadata/namespace","value":"zhiye"}]'
    target: { kind: Role, name: zhiye-sandbox-manager }
  - patch: '[{"op":"replace","path":"/metadata/namespace","value":"zhiye"}]'
    target: { kind: RoleBinding, name: zhiye-api-sandbox-manager }
  - patch: '[{"op":"replace","path":"/metadata/namespace","value":"zhiye"}]'
    target: { kind: NetworkPolicy, name: default-deny-all }
  - patch: '[{"op":"replace","path":"/spec/podSelector","value":{"matchLabels":{"app":"zhiye-sandbox"}}}]'
    target: { kind: NetworkPolicy, name: default-deny-all }
  - patch: '[{"op":"replace","path":"/metadata/namespace","value":"zhiye"}]'
    target: { kind: NetworkPolicy, name: sandbox-egress-gateway }
  - patch: '[{"op":"replace","path":"/metadata/namespace","value":"zhiye"}]'
    target: { kind: NetworkPolicy, name: sandbox-egress-npm }
  - patch: '[{"op":"replace","path":"/metadata/namespace","value":"zhiye"}]'
    target: { kind: NetworkPolicy, name: sandbox-ingress-api }
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: zhiye-api, namespace: zhiye }
      spec: { replicas: 2 }
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: zhiye-site, namespace: zhiye }
      spec: { replicas: 1 }
