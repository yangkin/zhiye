apiVersion: v1
kind: ConfigMap
metadata:
  name: zhiye-config
  namespace: zhiye
data:
  ZHIYE_DB_URL: jdbc:postgresql://10.110.170.10:5432/zhiye
  ZHIYE_AUTH_MODE: sso
  ZHIYE_FIVESTAR_ENABLED: "true"
  ZHIYE_FIVESTAR_MOCK: "false"
  ZHIYE_SKILLHUB_ENABLED: "true"
  ZHIYE_SKILLHUB_MOCK: "false"
  ZHIYE_PUBLIC_BASE_URL: https://zhiye.csot.tcl.com
  ZHIYE_PREVIEW_BASE: https://preview.zhiye.csot.tcl.com
  ZHIYE_SITE_BUILD_PREVIEW_BASE: https://zhiye.csot.tcl.com
  ZHIYE_SITE_TEMPLATE_PREVIEW_BASE: https://zhiye.csot.tcl.com
  ZHIYE_SITE_HOST_SUFFIX: zhiye.csot.tcl.com
  ZHIYE_SSO_REDIRECT_URL: https://zhiye.csot.tcl.com/access_token
  ZHIYE_S3_ENDPOINT: http://clouds3.csot.tcl.com:8082
  ZHIYE_S3_REGION: default
  ZHIYE_S3_BUCKET: zhiye
  ZHIYE_S3_PATH_STYLE: "true"
  ZHIYE_RUNNER_IMAGE: 10.110.27.113/zhiye/zhiye-runner:v0.1.5-test
  ZHIYE_SERVICE_HARBOR_REGISTRY: 10.110.27.113/zhiye
  ZHIYE_SERVICE_HARBOR_SECRET: harbor-registry-secret
  ZHIYE_SERVICE_KANIKO_IMAGE: 10.110.27.113/zhiye/kaniko-project/executor:v1.23.2
  ZHIYE_SERVICE_IMAGE_PYTHON: 10.110.27.113/zhiye/base-python:3.11-slim-csot
  ZHIYE_SERVICE_IMAGE_NODE: 10.110.27.113/zhiye/base-node:22-alpine-csot
  ZHIYE_SERVICE_IMAGE_JAVA_BUILD: 10.110.27.113/zhiye/base-maven:3.9-eclipse-temurin-21-alpine-csot
  ZHIYE_SERVICE_IMAGE_JAVA_RUNTIME: 10.110.27.113/zhiye/base-temurin:21-jre-alpine-csot
  ZHIYE_SERVICE_IMAGE_GO_BUILD: 10.110.27.113/zhiye/base-golang:1.23-alpine-csot
  ZHIYE_SERVICE_IMAGE_GO_RUNTIME: 10.110.27.113/zhiye/base-alpine:3.20-csot
  ZHIYE_SERVICE_RUNTIME_BUILD_NAMESPACE: zhiye
  ZHIYE_NPM_REGISTRY: https://registry.npmmirror.com
  ZHIYE_NPM_TARBALL_CDN: https://cdn.npmmirror.com/packages
  ZHIYE_PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
  ZHIYE_GO_PROXY: https://mirrors.aliyun.com/goproxy/,direct
  ZHIYE_SANDBOX_PROVIDER: k8s
  # 自建 k8s 沙箱与主服务同在 zhiye，复用现有 RWX PVC
  ZHIYE_SANDBOX_NAMESPACE: zhiye
  ZHIYE_SANDBOX_PVC: zhiye-runtime
  # 平台首任管理员 SSO 账号白名单（多个用英文逗号分隔）
  ZHIYE_ADMIN_ALLOW_LOGIN_NAMES: "admin,yangkai37"
  # 数据源代理允许访问的公司内网域名（按需增删）
  ZHIYE_SOURCES_ALLOWED_HOSTS: "*.csot.tcl.com"
  # 以下仅 legacy k8s provider 回滚时使用
  ZHIYE_SANDBOX_RUNTIME_CLASS: ""
