apiVersion: v1
kind: PersistentVolume
metadata:
  name: opensandbox-zhiye-runtime
spec:
  capacity: { storage: 100Gi }
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: zhiye-nas-static
  hostPath: { path: /var/zhiye-runtime, type: DirectoryOrCreate }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zhiye-runtime
  namespace: opensandbox
spec:
  accessModes: [ReadWriteMany]
  storageClassName: zhiye-nas-static
  resources:
    requests: { storage: 100Gi }
