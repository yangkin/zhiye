apiVersion: v1
kind: Namespace
metadata:
  name: zhiye-apps
  labels:
    app.kubernetes.io/part-of: zhiye
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zhiye-user-service-manager
  namespace: zhiye-apps
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "secrets", "persistentvolumeclaims", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zhiye-user-service-manager
  namespace: zhiye-apps
subjects:
  - kind: ServiceAccount
    name: zhiye-api
    namespace: zhiye
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zhiye-user-service-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zhiye-user-service-waker
  namespace: zhiye-apps
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zhiye-site-user-service-waker
  namespace: zhiye-apps
subjects:
  - kind: ServiceAccount
    name: zhiye-site
    namespace: zhiye
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zhiye-user-service-waker
---
apiVersion: v1
kind: LimitRange
metadata:
  name: zhiye-app-container-limits
  namespace: zhiye-apps
spec:
  limits:
    - type: Container
      max:
        cpu: "1"
        memory: "1Gi"
      min:
        cpu: "100m"
        memory: "128Mi"
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: zhiye-apps-namespace-quota
  namespace: zhiye-apps
spec:
  hard:
    limits.cpu: "64"
    limits.memory: "128Gi"
    requests.cpu: "32"
    requests.memory: "64Gi"
    pods: "160"
    persistentvolumeclaims: "160"
    requests.storage: "500Gi"
---
# 独立构建命名空间（zhiye-builds）：隔离 Kaniko 镜像构建 Job 与运行态 zhiye-apps 的 1C 1G LimitRange 及 restricted PSS
apiVersion: v1
kind: Namespace
metadata:
  name: zhiye-builds
  labels:
    app.kubernetes.io/part-of: zhiye
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zhiye-service-builder
  namespace: zhiye-builds
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zhiye-service-builder
  namespace: zhiye-builds
subjects:
  - kind: ServiceAccount
    name: zhiye-api
    namespace: zhiye
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zhiye-service-builder
---
apiVersion: v1
kind: LimitRange
metadata:
  name: zhiye-build-container-limits
  namespace: zhiye-builds
spec:
  limits:
    - type: Container
      max:
        cpu: "2"
        memory: "4Gi"
      min:
        cpu: "200m"
        memory: "256Mi"
      default:
        cpu: "2"
        memory: "3Gi"
      defaultRequest:
        cpu: "500m"
        memory: "1Gi"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: zhiye-builds-namespace-quota
  namespace: zhiye-builds
spec:
  hard:
    limits.cpu: "16"
    limits.memory: "32Gi"
    pods: "16"
---
# 与 API 共用 RWX 构建卷时，允许在主命名空间创建 Kaniko Job（最小权限）
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: zhiye-service-builder
  namespace: zhiye
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: zhiye-service-builder
  namespace: zhiye
subjects:
  - kind: ServiceAccount
    name: zhiye-api
    namespace: zhiye
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: zhiye-service-builder
