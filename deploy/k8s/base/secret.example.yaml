# 不要提交真实值。创建方式（示例）：
#   kubectl -n zhiye create secret generic zhiye-secrets \
#     --from-env-file=/path/to/kimi.env \                # 含 KIMI_API_KEY=...
#     --from-literal=ZHIYE_OPENSANDBOX_API_KEY=... \
#     --from-literal=ZHIYE_DB_PASSWORD=... \
#     --from-literal=ZHIYE_S3_ACCESS_KEY=... --from-literal=ZHIYE_S3_SECRET_KEY=...
# 生产建议用 External Secrets / 阿里云 KMS 凭据托管同步。
# 本文件不在 kustomization.yaml 里，只作说明。
apiVersion: v1
kind: Secret
metadata:
  name: zhiye-secrets
  namespace: zhiye
type: Opaque
stringData:
  KIMI_API_KEY: "<模型密钥，只给 zhiye-api>"
  # 换 DeepSeek 时用：再把 ConfigMap 的 ZHIYE_LLM_KEY_ENV 指向 DEEPSEEK_API_KEY（见 README 3.1）
  DEEPSEEK_API_KEY: "<可选，DeepSeek 密钥>"
  ZHIYE_OPENSANDBOX_API_KEY: "<公司 OpenSandbox API key，只给 zhiye-api>"
  ZHIYE_DB_PASSWORD: "<数据库密码>"
  ZHIYE_S3_ACCESS_KEY: "<对象存储 AccessKey>"
  ZHIYE_S3_SECRET_KEY: "<对象存储 SecretKey>"
  # 云服务应用令牌（zt.*）的 HMAC 签名密钥，生产必须设置；建议至少 32 位随机字符串
  ZHIYE_CLOUD_SECRET: "<云服务令牌签名密钥>"
  # 五星AI岛开启时：调用 openclaw 内部接口（按工号取 llm-gateway 路由）用的服务令牌，见 docs/fivestar-integration.md
  ZHIYE_OPENCLAW_INTERNAL_TOKEN: "<openclaw 内部接口服务令牌，给 zhiye-api 和 zhiye-site>"
  # 公共免费虚拟 Key：billingType=FREE 的模型用它调网关，不占个人额度（给 zhiye-api 和 zhiye-site）
  ZHIYE_FIVESTAR_PUBLIC_KEY: "<平台公共免费虚拟 Key，如 sk-bf-…>"
  ZHIYE_AGW_CLIENT_SECRET: "<Metis 客户端密钥，给 zhiye-api 和 zhiye-site>"
