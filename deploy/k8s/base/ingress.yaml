# Ingress 示例（ingress-nginx）。工作台、预览、已发布站点用不同的可注册域名更安全（见技术方案 §13），
# 这里为了示例都放在 zhiye.example.com 下：
#   zhiye.example.com             → zhiye-api:8080（工作台 + API + SSE）
#   preview.zhiye.example.com     → zhiye-site:8083（预览 /p/{buildId}/）
#   *.sites.zhiye.example.com     → zhiye-site:8083（已发布站点 {slug}.sites...）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zhiye
  namespace: zhiye
  annotations:
    # SSE 长连接
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["zhiye.example.com", "preview.zhiye.example.com", "*.sites.zhiye.example.com"]
      secretName: zhiye-tls
  rules:
    - host: zhiye.example.com
      http:
        paths:
          # 模型网关只给集群内的沙箱用，不对外暴露：/llm 转给 site（site 没有这个路由，返回 404）
          - path: /llm
            pathType: Prefix
            backend: { service: { name: zhiye-site, port: { number: 8083 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: zhiye-api, port: { number: 8080 } } }
    - host: preview.zhiye.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: zhiye-site, port: { number: 8083 } } }
    - host: "*.sites.zhiye.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: zhiye-site, port: { number: 8083 } } }
