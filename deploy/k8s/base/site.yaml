# zhiye-site：预览 /p/{buildId}/ 与已发布站点 {slug}.sites.<域名>（公网流量，单独扩缩容）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zhiye-site
  namespace: zhiye
  labels: { app: zhiye-site, app.kubernetes.io/part-of: zhiye }
spec:
  replicas: 2
  selector:
    matchLabels: { app: zhiye-site }
  template:
    metadata:
      labels: { app: zhiye-site, app.kubernetes.io/part-of: zhiye }
    spec:
      serviceAccountName: zhiye-site
      # 需要按需唤醒 zhiye-apps 命名空间里已休眠的单体服务（最小权限 Role: zhiye-user-service-waker）
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      nodeSelector:
        zhiye/pool: general
      containers:
        - name: site
          image: zhiye-server:dev
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8083 }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "site,k8s" }
            - { name: XDG_CONFIG_HOME, value: "/tmp/zhiye-config" }
            # site 不执行任务：显式 local，覆盖 ConfigMap 里的 opensandbox（Deployment env 优先于 envFrom），
            # 避免构造 OpenSandbox SDK 客户端。
            - { name: ZHIYE_SANDBOX_PROVIDER, value: local }
            - name: ZHIYE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: zhiye-secrets, key: ZHIYE_DB_PASSWORD } }
            - name: ZHIYE_S3_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: zhiye-secrets, key: ZHIYE_S3_ACCESS_KEY, optional: true } }
            - name: ZHIYE_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: zhiye-secrets, key: ZHIYE_S3_SECRET_KEY, optional: true } }
            # site 也会构造 CloudService（预览注入令牌），k8s profile 下缺这个密钥会启动失败
            - name: ZHIYE_CLOUD_SECRET
              valueFrom: { secretKeyRef: { name: zhiye-secrets, key: ZHIYE_CLOUD_SECRET, optional: true } }
            # 发布站点的应用内 AI（/__zhiye/ai）按作者工号走五星AI岛路由（只在 ZHIYE_FIVESTAR_ENABLED=true 时用到）
            - name: ZHIYE_OPENCLAW_INTERNAL_TOKEN
              valueFrom: { secretKeyRef: { name: zhiye-secrets, key: ZHIYE_OPENCLAW_INTERNAL_TOKEN, optional: true } }
            # 公共免费虚拟 Key：billingType=FREE 的模型用它调网关，不占个人额度
            - name: ZHIYE_FIVESTAR_PUBLIC_KEY
              valueFrom: { secretKeyRef: { name: zhiye-secrets, key: ZHIYE_FIVESTAR_PUBLIC_KEY, optional: true } }
            - name: ZHIYE_AGW_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: zhiye-secrets, key: ZHIYE_AGW_CLIENT_SECRET, optional: true } }
          envFrom:
            - configMapRef: { name: zhiye-config }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # 云函数在 site 进程执行：按 Git 提交只读检出仓库源码，并把 Deno 编译缓存写到独立可写卷（根文件系统保持只读）
            - { name: runtime, mountPath: /var/lib/zhiye/runtime/repos, subPath: repos, readOnly: true }
            - { name: deno-cache, mountPath: /var/lib/zhiye/runtime/deno-cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: runtime
          persistentVolumeClaim: { claimName: zhiye-runtime }
        - name: deno-cache
          emptyDir: { sizeLimit: 512Mi }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: zhiye-site
  namespace: zhiye
  labels: { app: zhiye-site, app.kubernetes.io/part-of: zhiye }
spec:
  selector: { app: zhiye-site }
  ports:
    - { name: http, port: 8083, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zhiye-site
  namespace: zhiye
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: zhiye-site }
